plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.36-kappa'
}

version = '1.12.2-2.0.0-beta.2'
group = 'com.buuz135.thaumicjei'
base { archivesName = 'ThaumicJEI-Java25' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://repo.cleanroommc.com/releases/' }
    maven { url = 'https://www.cursemaven.com/' }
    mavenCentral()
}

sourceSets {
    differential {
        java.srcDir 'src/differential/java'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

tasks.register('differentialJar', Jar) {
    dependsOn differentialClasses
    archiveClassifier = 'differential-dev'
    from sourceSets.main.output
    from sourceSets.differential.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.attributes('ModType': 'CRL', 'Implementation-Version': project.version)
    finalizedBy 'remapDifferentialJar'
}

unimined.minecraft {
    version '1.12.2'
    mappings { mcp('stable', '39-1.12') }
    cleanroom {
        loader '0.6.13-alpha'
    }
    defaultRemapJar = false
    remap(tasks.named('jar').get())
    remap(tasks.named('differentialJar').get())
}

sourceSets.differential {
    compileClasspath = sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath = sourceSets.main.runtimeClasspath + sourceSets.main.output
}

dependencies {
    modImplementation 'mezz:jei:4.36.1'
    modImplementation 'curse.maven:thaumcraft-223628:2629023'
    modImplementation 'curse.maven:baubles-227083:2518667'
    runtimeOnly 'org.scala-lang:scala-library:2.11.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand version: project.version, mcversion: '1.12.2'
    }
}

jar {
    archiveClassifier = 'dev'
    manifest.attributes('ModType': 'CRL', 'Implementation-Version': project.version)
    finalizedBy 'remapJar'
}

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

tasks.register('copyDifferential', Copy) {
    dependsOn remapDifferentialJar
    from("$buildDir/tmp/remapDifferentialJar") { include '*-temp-searge.jar' }
    into("$buildDir/test-artifacts")
    rename { "${base.archivesName.get()}-${project.version}-differential.jar" }
}

test { useJUnitPlatform() }
// Both remappers otherwise choose the same unclassified output path.
tasks.named('remapDifferentialJar') { mustRunAfter tasks.named('remapJar') }
